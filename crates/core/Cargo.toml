[package]
name = "mayasaba-core"
version.workspace = true
edition.workspace = true

[dependencies]
mayasaba-protocol = { path = "../protocol" }
mayasaba-bus = { path = "../bus" }
mayasaba-agents = { path = "../agents" }
mayasaba-council = { path = "../council" }
mayasaba-tasks = { path = "../tasks" }
mayasaba-workspace = { path = "../workspace" }
mayasaba-execution = { path = "../execution" }
mayasaba-validation = { path = "../validation" }
mayasaba-evidence = { path = "../evidence" }
mayasaba-policy = { path = "../policy" }
mayasaba-storage = { path = "../storage" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

# Test-only. The diagnostics tests seed rows directly to exercise the queries, and `crates/core` must not carry
# the SQLite driver as a production dependency: `crates/storage` owns persistence, and core holding SQL would
# reach through that boundary (AGENTS.md section 6). A dev-dependency is not a production edge.
[dev-dependencies]
rusqlite.workspace = true