[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/protocol",
  "crates/bus",
  "crates/agents",
  "crates/council",
  "crates/tasks",
  "crates/workspace",
  "crates/execution",
  "crates/validation",
  "crates/evidence",
  "crates/policy",
  "crates/storage",
  "apps/desktop/src-tauri"
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite driver for crates/storage. `bundled` compiles SQLite from the vendored amalgamation so the MSI
# carries no external database dependency and the local-first constraint (DEC-004, DEC-020) holds: SQLite
# app data is the sole durable source of truth and nothing is installed system-wide.
rusqlite = { version = "0.37", features = ["bundled"] }
# SHA-256 for the durable digests DEC-025 and DEC-034 both name. Already in the dependency graph through the
# Tauri toolchain, so declaring it adds a direct edge rather than a new package. The digest is the one part of
# canonicalization that must not be hand-written: a subtly wrong implementation produces a chain that verifies
# against itself and against nothing else.
sha2 = "0.10"
