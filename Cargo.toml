[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/protocol",
  "crates/bus",
  "crates/agents",
  "crates/council",
  "crates/tasks",
  "crates/workspace",
  "crates/execution",
  "crates/validation",
  "crates/evidence",
  "crates/policy",
  "crates/storage",
  "apps/desktop/src-tauri"
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
