version: 1
protocol: mayasaba.mcf.v2
tests:
  - envelope_schema_validates
  - every_message_has_payload_mapping
  - every_message_has_priority_mapping
  - material_messages_require_authorization_context
  - ack_precedes_processing_outcome
  - duplicate_operation_is_idempotent
  - stale_epoch_is_rejected
  - stale_digest_is_rejected
  - sequence_gap_is_detected
  - dead_letter_preserves_original_identity
  - replay_does_not_bypass_authorization
